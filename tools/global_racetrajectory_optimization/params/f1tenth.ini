# F1Tenth-scale vehicle parameters for TUM global_racetrajectory_optimization.
# Based on stock F1Tenth build (~1:10 scale) — adjust curvlim / width if different.

[GENERAL_OPTIONS]

ggv_file="ggv_f1tenth.csv"
ax_max_machines_file="ax_max_machines_f1tenth.csv"

# Small scale: use 0.1 m steps everywhere
stepsize_opts={"stepsize_prep": 0.05,
               "stepsize_reg": 0.1,
               "stepsize_interp_after_opt": 0.05}

reg_smooth_opts={"k_reg": 3,
                 "s_reg": 1.0}

curv_calc_opts = {"d_preview_curv": 0.3,
                  "d_review_curv": 0.3,
                  "d_preview_head": 0.15,
                  "d_review_head": 0.15}

# v_max  : F1Tenth practical top speed
# length : car length ~0.50 m
# width  : car width ~0.30 m
# mass   : ~3.5 kg
# dragcoeff : negligible at low speed
# curvlim  : 1/min_turn_radius; with wheelbase 0.33 + steering_max 0.40 rad,
#            min R ≈ L/tan(delta) ≈ 0.78 m -> curvlim ≈ 1.3
veh_params = {"v_max": 5.0,
              "length": 0.50,
              "width": 0.30,
              "mass": 3.5,
              "dragcoeff": 0.01,
              "curvlim": 1.3,
              "g": 9.81}

vel_calc_opts = {"dyn_model_exp": 1.0,
                 "vel_profile_conv_filt_window": null}

[OPTIMIZATION_OPTIONS]

# width_opt = car width + safety margin
optim_opts_shortest_path={"width_opt": 0.25}

optim_opts_mincurv={"width_opt": 0.25,
                    "iqp_iters_min": 3,
                    "iqp_curverror_allowed": 0.05}

# (mintime options kept minimal — not used for mincurv runs)
optim_opts_mintime={"width_opt": 0.25,
                    "penalty_delta": 10.0,
                    "penalty_F": 0.01,
                    "mue": 1.0,
                    "n_gauss": 5,
                    "dn": 0.025,
                    "limit_energy": false,
                    "energy_limit": 2.0,
                    "safe_traj": false,
                    "ax_pos_safe": null,
                    "ax_neg_safe": null,
                    "ay_safe": null,
                    "w_tr_reopt": 0.40,
                    "w_veh_reopt": 0.30,
                    "w_add_spl_regr": 0.2,
                    "step_non_reg": 0.0,
                    "eps_kappa": 1e-3}

[VEHICLE_PARAMS_MINTIME]
# unused for mincurv but required to parse
wheelbase_front = 0.165
wheelbase_rear = 0.165
track_width_front = 0.28
track_width_rear = 0.28
cog_z = 0.07
I_z = 0.04
liftcoeff_front = 0.0
liftcoeff_rear = 0.0
k_brake_front = 0.5
k_drive_front = 0.0
k_roll = 0.5
t_delta = 0.1
t_drive = 0.1
t_brake = 0.1
power_max = 50.0
f_drive_max = 10.0
f_brake_max = 15.0
delta_max = 0.40
beta_max = 0.5
omega_yaw_max = 5.0

[TIRE_PARAMS_MINTIME]
c_roll = 0.013
f_z0 = 8.6
B_front = 10.0
C_front = 2.5
eps_front = -0.1
E_front = 1.0
B_rear = 10.0
C_rear = 2.5
eps_rear = -0.1
E_rear = 1.0

[POWERTRAIN_PARAMS_MINTIME]
# placeholder (powertrain model disabled)
pwr_behavior = false
